<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="presentation">
  <defs>
    <filter id="softglow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
      <clipPath id="stripclip">
      <rect x="6" y="6" width="1188" height="60" rx="10"/>
    </clipPath>
    <linearGradient id="sheenfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE9EC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFE9EC" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFE9EC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="72" fill="none"/>
  <rect x="6" y="6" width="1188" height="60" rx="10" fill="#050001" stroke="#FF0033" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softglow)"/>
