<svg xmlns="http://www.w3.org/2000/svg" width="880" height="24" viewBox="0 0 880 24" role="presentation">
  <defs>
    <linearGradient id="goldL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A441" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#D9A441" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFC857" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="goldR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC857" stop-opacity="0.95"/>
      <stop offset="0.75" stop-color="#D9A441" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purpC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BF00FF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#BF00FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#BF00FF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- left gold run -->
  <line x1="30" y1="12" x2="382" y2="12" stroke="url(#goldL)" stroke-width="1.6"/>
  <!-- right gold run -->
  <line x1="498" y1="12" x2="850" y2="12" stroke="url(#goldR)" stroke-width="1.6"/>
  <!-- centre purple segment -->
  <line x1="382" y1="12" x2="498" y2="12" stroke="url(#purpC)" stroke-width="1.8"/>
  <!-- gold sparkles on the side runs -->
  <g fill="#FFD97A">
    <path transform="translate(118 12)" d="M0,-7 L1.6,-1.6 L7,0 L1.6,1.6 L0,7 L-1.6,1.6 L-7,0 L-1.6,-1.6 Z"/>
    <path transform="translate(238 12)" fill="#FFC857" d="M0,-5 L1.1,-1.1 L5,0 L1.1,1.1 L0,5 L-1.1,1.1 L-5,0 L-1.1,-1.1 Z"/>
    <path transform="translate(322 12)" fill="#FFE9A8" d="M0,-4 L0.9,-0.9 L4,0 L0.9,0.9 L0,4 L-0.9,0.9 L-4,0 L-0.9,-0.9 Z"/>
    <path transform="translate(558 12)" fill="#FFE9A8" d="M0,-4 L0.9,-0.9 L4,0 L0.9,0.9 L0,4 L-0.9,0.9 L-4,0 L-0.9,-0.9 Z"/>
    <path transform="translate(642 12)" fill="#FFC857" d="M0,-5 L1.1,-1.1 L5,0 L1.1,1.1 L0,5 L-1.1,1.1 L-5,0 L-1.1,-1.1 Z"/>
    <path transform="translate(762 12)" d="M0,-7 L1.6,-1.6 L7,0 L1.6,1.6 L0,7 L-1.6,1.6 L-7,0 L-1.6,-1.6 Z"/>
  </g>
  <g fill="#FFF3D6">
    <circle cx="118" cy="12" r="1.3"/>
    <circle cx="238" cy="12" r="1"/>
    <circle cx="642" cy="12" r="1"/>
    <circle cx="762" cy="12" r="1.3"/>
  </g>
  <!-- centre diamond, purple -->
  <rect x="433" y="5" width="14" height="14" transform="rotate(45 440 12)" fill="#E0AAFF" stroke="#BF00FF" stroke-width="1.3"/>
