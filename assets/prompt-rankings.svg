<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="presentation">
  <defs>
    <filter id="softglow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="72" fill="none"/>
  <rect x="6" y="6" width="1188" height="60" rx="10" fill="#050001" stroke="#FF0033" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softglow)"/>
  <circle cx="30" cy="36" r="5" fill="#FF3355"/>
  <circle cx="48" cy="36" r="5" fill="#FF0033"/>
  <circle cx="66" cy="36" r="5" fill="#FF8296"/>
  <text x="88" y="43" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="20"><tspan font-weight="bold" fill="#FF5C74">epsilon0xcell@research:~$</tspan><tspan fill="#FF8296"> ./verify-rankings.sh</tspan></text>
  <rect x="650" y="26" width="11" height="20" fill="#FF3355"><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>
