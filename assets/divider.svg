<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF3355" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5C74" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF5C74" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF5C74" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="24" fill="none"/>
  <g filter="url(#dglow)">
    <rect x="60" y="10.5" width="1080" height="3" fill="url(#fade)"/>
    <rect x="30" y="10.5" width="120" height="3" fill="url(#pulse)">
      <animate attributeName="x" values="30;1020;30" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1020" y="10.5" width="120" height="3" fill="url(#pulse)" opacity="0.35">
      <animate attributeName="x" values="1020;30;1020" keyTimes="0;0.5;1" dur="11s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(600 12)">
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.22;1" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="#FF3355">
        <animate attributeName="opacity" values="1;0.6;1" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
